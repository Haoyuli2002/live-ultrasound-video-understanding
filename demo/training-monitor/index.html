<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v3 训练监控</title><link rel="stylesheet" href="monitor.css"><script defer src="monitor.js"></script></head>
<body><main><header><div><div class="project">流式超声问答 / Event Retrieval v3</div><h1>训练监控</h1><p>28 + 2 帧窗口　·　10 视频 overfit　·　纯 NTP</p></div><div class="sync"><b id="status">正在读取数据</b><small id="refresh">每 10 秒刷新</small></div></header>
<section class="runs" id="runs" aria-label="训练作业"></section>
<section class="panel"><div class="heading"><h2>训练损失</h2><label>纵轴 <select id="scale"><option value="linear">线性</option><option value="log">对数</option></select></label></div><div class="legend"><i></i> BS4 <i></i> BS8</div><canvas id="loss" aria-label="按训练轮数比较 NTP 损失"></canvas></section>
<div class="twocol"><section class="panel"><h2>GPU 利用率</h2><div class="legend"><i></i> BS4 <i></i> BS8</div><canvas id="gpu" aria-label="按运行分钟显示 GPU 利用率"></canvas></section>
<section class="panel"><h2>显存占用</h2><div class="legend"><i></i> BS4 <i></i> BS8</div><canvas id="mem" aria-label="按运行分钟显示显存占用"></canvas></section></div>
<footer>GPU 时间从各作业首条采样起算。利用率按 30 秒取均值，显存按 30 秒取峰值。</footer></main></body></html>
